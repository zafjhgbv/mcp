        - remote_url
      number_limits: 5
    opening_statement: '您好！我是深度研究助手🔍。我可以帮助您：

1. 📝 **深度研究报告** - 基于任何主题生成详细的研究报告
2. 🌐 **网页内容抓取** - 智能提取网页核心内容和链接
3. 👋 **问候服务** - 简单的问候和交互

请告诉我您想要研究的主题，或者需要抓取的网页URL！'
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - '帮我研究一下人工智能在医疗领域的最新应用'
    - '分析一下区块链技术的发展趋势'
    - '抓取这个网页的主要内容：https://example.com'
    - '生成关于机器学习算法的深度研究报告'
    - '你好，我是用户小明'
